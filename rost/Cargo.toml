[package]
name = "rost"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
phf = { version = "0.11", features = ["macros"] }
itertools = "0.10.2"
rust-lapper = { version = "*", features = ["with_serde"] }
clap = { version = "4.5.17", features = ["derive"] }